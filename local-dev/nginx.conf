map $server_port $backend_port {
    4000 3000;
    4001 3001;
    4002 3002;
    4003 3003;
    4004 3004;
    4005 3005;
    4006 3006;
    4007 3007;
    4008 3008;
    4009 3009;
}

server {
    listen 80;
    server_name localhost local.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 4000 ssl;
    listen 4001 ssl;
    listen 4002 ssl;
    listen 4003 ssl;
    listen 4004 ssl;
    listen 4005 ssl;
    listen 4006 ssl;
    listen 4007 ssl;
    listen 4008 ssl;
    listen 4009 ssl;

    server_name localhost local.dev;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://host.docker.internal:$backend_port;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
